name: CI

# Workflow does not consume any user-controlled input (issue/PR titles or bodies,
# commit messages, comments, head_ref, etc.). Only built-in GitHub contexts and
# matrix values are interpolated, so command-injection vectors are not in scope.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: rake (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    # `head` tracks Ruby's main branch (currently 4.0 development) and is
    # allowed to fail without blocking — it's an early-warning smoke test.
    continue-on-error: ${{ matrix.ruby == 'head' }}
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.1", "3.2", "3.3", "3.4", "3.5", "head"]
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run rake (spec + rubocop)
        run: bundle exec rake
